dependencies {
	compileOnly group: "com.liferay.portal", name: "release.portal.api"

	// Portlet API
	compileOnly group: "javax.portlet", name: "portlet-api", version: "2.0"

	// OSGi annotations (Component, Reference, etc.)
	compileOnly group: "org.osgi", name: "osgi.cmpn", version: "6.0.0"

	// AX-HRMS Service API (Employee, Holiday, Leave, WFH)
	compileOnly project(":modules:ax-hrms:ax-hrms-api")

	// AX-HRMS Master API (LeaveCompensatoryStatusMaster)
	compileOnly project(":modules:ax-hrms-master:ax-hrms-master-api")

	// AX-HRMS Common API (AxHrmsCommonApi - Excel parsing, date formatting)
	compileOnly project(":modules:ax-hrms-common-api")

	// AX-HRMS Configuration (MailTemplateConfiguration)
	compileOnly project(":modules:ax-hrms-configuration")

	// Apache POI for Excel parsing (already deployed via ax-hrms-common-service)
	compileOnly group: "org.apache.poi", name: "poi", version: "5.2.3"
	compileOnly group: "org.apache.poi", name: "poi-ooxml", version: "5.2.3"

	cssBuilder group: "com.liferay", name: "com.liferay.css.builder", version: "3.1.4"
}